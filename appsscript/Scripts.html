    function preencherDemonstracao() {
      const perfis = obterPerfisDemonstracaoCliente();
      const indice = state.demoAutofillIndex % perfis.length;
      const perfil = perfis[indice];

      state.demoAutofillIndex = (indice + 1) % perfis.length;

      document.getElementById('name').value = perfil.nome;
      document.getElementById('email').value = perfil.email;
      document.getElementById('position').value = perfil.cargo;
      document.getElementById('department').value = perfil.departamento;
      document.getElementById('admissionDate').value = perfil.dataAdmissao;
      document.getElementById('workMode').value = perfil.modalidade;
      document.getElementById('contractType').value = perfil.tipoVinculo;
      document.getElementById('leaderName').value = perfil.liderResponsavel;
      document.getElementById('leaderEmail').value = perfil.emailLider;
      document.getElementById('notes').value =
        'Perfil fictício ' + String(indice + 1).padStart(2, '0') +
        ' de 20, preparado para demonstrar o fluxo acadêmico do OnboardFlow.';

      mostrarToast(
        perfil.nome + ' preenchido para demonstração (' + (indice + 1) + ' de ' + perfis.length + ').',
        'success'
      );
    }

    function exibirModalResultado(resultado) {
      definirTexto(
        'resultModalMessage',
        resultado.mensagem || 'Todas as etapas foram executadas.'
      );

      document.getElementById('resultModalDetails').innerHTML = [
        criarDetalheResultado('Colaborador', resultado.colaborador || '-'),
        criarDetalheResultado('Tarefas criadas', resultado.tarefasCriadas || 0),
        criarDetalheResultado('Evento no Agenda', resultado.eventoCriado ? 'Criado' : 'Não criado'),
        criarDetalheResultado('E-mail de boas-vindas', resultado.emailEnviado ? 'Enviado' : 'Não enviado'),
        criarDetalheResultado(
          'Destinatário do teste',
          resultado.destinatarioTeste || 'Configurado no servidor'
        )
      ].join('');

      const modal = document.getElementById('resultModal');
      state.focoAnteriorResultado = document.activeElement;
      modal.hidden = false;
      modal.setAttribute('aria-hidden', 'false');
      window.requestAnimationFrame(function () {
        const card = modal.querySelector('.modal-card');
        if (card) card.focus({ preventScroll: true });
      });
    }

    function criarDetalheResultado(rotulo, valor) {
      return (
        '<div class="result-detail">' +
        '<span>' + escaparHtml(rotulo) + '</span>' +
        '<strong>' + escaparHtml(String(valor)) + '</strong>' +
        '</div>'
      );
    }

    function fecharModal() {
      const modal = document.getElementById('resultModal');
      modal.hidden = true;
      modal.setAttribute('aria-hidden', 'true');
      restaurarFocoSeguro(state.focoAnteriorResultado);
      state.focoAnteriorResultado = null;
    }

    function definirCarregamento(ativo, titulo, mensagem) {
      const overlay = document.getElementById('loadingOverlay');
      overlay.hidden = !ativo;
      overlay.setAttribute('aria-hidden', String(!ativo));

      if (titulo) {
        definirTexto('loadingTitle', titulo);
      }

      if (mensagem) {
        definirTexto('loadingMessage', mensagem);
      }
    }

    function definirConexao(tipo, texto) {
      const elemento = document.getElementById('connectionStatus');
      elemento.className = 'connection-status is-' + tipo;
      elemento.innerHTML = '<span class="status-dot"></span>' + escaparHtml(texto);
    }

    function tratarErro(mensagem) {
      definirConexao('error', 'Erro');
      mostrarToast(mensagem || 'Ocorreu um erro inesperado.', 'error');
    }

    function mostrarToast(mensagem, tipo) {
      const toast = document.getElementById('toast');

      if (state.toastTimer) {
        window.clearTimeout(state.toastTimer);
      }

      toast.textContent = mensagem;
      toast.className = 'toast ' + (tipo === 'error' ? 'is-error' : 'is-success');
      toast.hidden = false;

      state.toastTimer = window.setTimeout(function () {
        toast.hidden = true;
      }, 5000);
    }

    function definirTexto(id, valor) {
      const elemento = document.getElementById(id);
      if (elemento) {
        elemento.textContent = String(valor);
      }
    }

    function formatarData(valor) {
      if (!valor) {
        return '-';
      }

      const partes = String(valor).substring(0, 10).split('-');
      if (partes.length !== 3) {
        return escaparHtml(valor);
      }

      return partes[2] + '/' + partes[1] + '/' + partes[0];
    }

    function formatarDataInput(data) {
      return [
        data.getFullYear(),
        String(data.getMonth() + 1).padStart(2, '0'),
        String(data.getDate()).padStart(2, '0')
      ].join('-');
    }

    function limitarNumero(valor, minimo, maximo) {
      const numero = Number(valor);
      if (!Number.isFinite(numero)) {
        return minimo;
      }

      return Math.max(minimo, Math.min(maximo, Math.round(numero)));
    }

    function normalizarClasse(valor) {
      return String(valor || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function escaparHtml(valor) {
      return String(valor || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escaparAtributo(valor) {
      return escaparHtml(valor);
    }

    function extrairMensagemErro(error) {
      if (!error) {
        return 'Ocorreu um erro inesperado.';
      }

      if (error.message) {
        return error.message;
      }

      return String(error);
    }
  })();
</script>
