<script>
  (function () {
    'use strict';

    const state = {
      colaboradores: [],
      indicadores: {},
      pesquisa: '',
      filtroDepartamento: '',
      filtroStatus: '',
      ordenacao: 'recent',
      dashboardDepartamento: '',
      dashboardStatus: '',
      tarefaPesquisa: '',
      tarefaStatus: '',
      tarefaArea: '',
      tarefaOrdenacao: 'order',
      toastTimer: null,
      detalhesAtuais: null,
      acaoTarefaEmAndamento: false,
      acaoOnboardingEmAndamento: false,
      confirmacaoPendente: null,
      ultimoFocoModal: null,
      focoAnteriorConfirmacao: null,
      focoAnteriorResultado: null,
      detalhesRecordIdAtual: '',
      detalhesTimeout: null,
      detalhesRequestToken: 0,
      historicoCategoria: '',
      demoAutofillIndex: 0,
      detalhesAbaAtual: 'summary',
      detalhesScrollPorAba: {
        summary: 0,
        tasks: 0,
        history: 0
      },
      detalhesAbasVisitadas: {
        summary: true,
        tasks: false,
        history: false
      },
      centralTarefasDados: null,
      centralTarefasCarregada: false,
      centralTarefasCarregando: false,
      centralTarefasPesquisa: '',
      centralTarefasProcesso: 'active',
      centralTarefasStatus: '',
      centralTarefasArea: '',
      centralTarefasDepartamento: '',
      centralTarefasFase: '',
      centralTarefasOrdenacao: 'flow',
      etapaTarefaGrupoAtual: null,
      etapaTarefaPesquisa: '',
      etapaTarefaProcesso: 'active',
      etapaTarefaStatus: '',
      etapaTarefaDepartamento: '',
      etapaTarefaOrdenacao: 'status',
      etapaTarefaUltimoFoco: null,
      centralTarefasRetornoGrupo: '',
      centralTarefasVoltando: false,
      detalhesAbaSolicitada: '',
      detalhesTarefaSolicitada: ''
    };

    document.addEventListener('DOMContentLoaded', inicializarAplicacao);

    function inicializarAplicacao() {
      registrarEventos();
      inicializarDetalhesOnboarding();
      inicializarCentralTarefas();
      carregarDadosIniciais(true);
    }

    function registrarEventos() {
      document.querySelectorAll('[data-view]').forEach(function (button) {
        button.addEventListener('click', function () {
          trocarVisualizacao(button.dataset.view);
        });
      });

      document.querySelectorAll('[data-go-view]').forEach(function (button) {
        button.addEventListener('click', function () {
          trocarVisualizacao(button.dataset.goView);
        });
      });

      document.getElementById('refreshButton').addEventListener('click', function () {
        carregarDadosIniciais(true);
      });

      document.getElementById('onboardingForm').addEventListener('submit', enviarFormulario);
      document.getElementById('cancelOnboardingFormButton').addEventListener('click', solicitarCancelamentoCadastro);

      document.getElementById('collaboratorSearch').addEventListener('input', function (event) {
        state.pesquisa = event.target.value.trim().toLocaleLowerCase('pt-BR');
        renderizarTabelaCompleta();
      });

      document.getElementById('collaboratorDepartmentFilter').addEventListener('change', function (event) {
        state.filtroDepartamento = event.target.value;
        renderizarTabelaCompleta();
      });

      document.getElementById('collaboratorStatusFilter').addEventListener('change', function (event) {
        state.filtroStatus = event.target.value;
        renderizarTabelaCompleta();
      });

      document.getElementById('collaboratorSort').addEventListener('change', function (event) {
        state.ordenacao = event.target.value || 'recent';
        renderizarTabelaCompleta();
      });

      document.getElementById('clearCollaboratorFilters').addEventListener('click', limparFiltrosColaboradores);
      document.getElementById('exportCollaboratorsButton').addEventListener('click', exportarColaboradoresCsv);

      document.getElementById('dashboardDepartmentFilter').addEventListener('change', function (event) {
        state.dashboardDepartamento = event.target.value;
        renderizarDashboard();
      });

      document.getElementById('dashboardStatusFilter').addEventListener('change', function (event) {
        state.dashboardStatus = event.target.value;
        renderizarDashboard();
      });

      document.getElementById('clearDashboardFilters').addEventListener('click', limparFiltrosDashboard);

      document.querySelectorAll('[data-dashboard-status]').forEach(function (card) {
        card.addEventListener('click', function () {
          state.dashboardStatus = card.dataset.dashboardStatus || '';
          document.getElementById('dashboardStatusFilter').value = state.dashboardStatus;
          renderizarDashboard();
        });
      });

      document.getElementById('dashboardInsightAction').addEventListener('click', function (event) {
        const button = event.currentTarget;
        const status = button.dataset.dashboardStatus || '';
        const view = button.dataset.goView || '';

        if (status === '__clear__') {
          limparFiltrosDashboard();
          return;
        }

        if (status) {
          state.dashboardStatus = status;
          document.getElementById('dashboardStatusFilter').value = status;
          renderizarDashboard();
          return;
        }

        if (view) {
          trocarVisualizacao(view);
        }
      });

      document.getElementById('closeResultModal').addEventListener('click', fecharModal);
      document.getElementById('resultModalConfirm').addEventListener('click', function () {
        fecharModal();
        trocarVisualizacao('dashboard');
      });

      document.getElementById('resultModal').addEventListener('click', function (event) {
        if (event.target.id === 'resultModal') fecharModal();
      });

      document.getElementById('closeConfirmationModal').addEventListener('click', fecharConfirmacao);
      document.getElementById('confirmationCancelButton').addEventListener('click', fecharConfirmacao);
      document.getElementById('confirmationConfirmButton').addEventListener('click', executarConfirmacaoPendente);
      document.getElementById('confirmationModal').addEventListener('click', function (event) {
        if (event.target.id === 'confirmationModal') fecharConfirmacao();
      });
    }
    function trocarVisualizacao(nome) {
      const visualizacao = nome || 'dashboard';

      document.querySelectorAll('.view-section').forEach(function (section) {
        section.classList.remove('is-active');
      });

      document.querySelectorAll('.nav-button').forEach(function (button) {
        button.classList.toggle('is-active', button.dataset.view === visualizacao);
      });

      const alvo = document.getElementById('view-' + visualizacao);
      if (alvo) {
        alvo.classList.add('is-active');
      }

      if (visualizacao === 'tasks') {
        carregarCentralTarefas(false);
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function carregarDadosIniciais(mostrarCarregamento) {
      definirConexao('loading', 'Carregando');

      if (mostrarCarregamento) {
        definirCarregamento(
          true,
          'Carregando dados',
          'Consultando o Airtable e atualizando o painel operacional.'
        );
      }

      google.script.run
        .withSuccessHandler(function (resultado) {
          definirCarregamento(false);

          if (!resultado || !resultado.sucesso) {
            tratarErro(
              resultado && resultado.mensagem
                ? resultado.mensagem
                : 'Não foi possível carregar os dados.'
            );
            return;
          }

          state.colaboradores = Array.isArray(resultado.colaboradores)
            ? resultado.colaboradores
            : [];
          state.indicadores = resultado.indicadores || {};

          document.getElementById('environmentMessage').textContent =
            resultado.mensagemAmbiente || 'Ambiente de apresentação conectado.';

          atualizarOpcoesFiltros();
          renderizarDashboard();
          renderizarTabelaCompleta();
          definirConexao('connected', 'Conectado');
        })
        .withFailureHandler(function (error) {
          definirCarregamento(false);
          tratarErro(extrairMensagemErro(error));
        })
        .obterDadosIniciais();
    }
    function renderizarDashboard() {
      const colaboradores = obterColaboradoresDashboardFiltrados();
      const indicadores = calcularIndicadoresCliente(colaboradores);

      definirTexto('metricTotal', indicadores.total);
      definirTexto('metricPending', indicadores.pendentes);
      definirTexto('metricInProgress', indicadores.emAndamento);
      definirTexto('metricCompleted', indicadores.concluidos);
      definirTexto('metricCancelled', indicadores.cancelados);
      definirTexto('metricAverageProgress', indicadores.progressoMedio + '%');
      definirTexto('metricTasks', indicadores.tarefasGeradas);
      definirTexto('metricEvents', indicadores.eventosCriados);
      definirTexto('metricEmails', indicadores.emailsEnviados);
      definirTexto('metricOverdueTasks', indicadores.tarefasAtrasadas);

      const mediaTarefas = indicadores.total
        ? indicadores.tarefasGeradas / indicadores.total
        : 0;
      const coberturaEventos = indicadores.total
        ? Math.round((indicadores.eventosCriados / indicadores.total) * 100)
        : 0;
      const coberturaEmails = indicadores.total
        ? Math.round((indicadores.emailsEnviados / indicadores.total) * 100)
        : 0;

      definirTexto(
        'metricTasksDetail',
        formatarNumeroCompacto(mediaTarefas) +
          (mediaTarefas === 1 ? ' tarefa por processo' : ' tarefas por processo')
      );
      definirTexto('metricEventsDetail', coberturaEventos + '% de cobertura');
      definirTexto('metricEmailsDetail', coberturaEmails + '% de cobertura');
      definirTexto(
        'metricOverdueDetail',
        indicadores.tarefasAtrasadas
          ? pluralizarQuantidade(indicadores.tarefasAtrasadas, 'prazo exige atenção', 'prazos exigem atenção')
          : 'Nenhum prazo vencido'
      );

      document.getElementById('metricEventsBar').style.width = coberturaEventos + '%';
      document.getElementById('metricEmailsBar').style.width = coberturaEmails + '%';

      atualizarEstadoCardsDashboard();
      atualizarInsightDashboard(indicadores);

      const filtrosAtivos = [
        state.dashboardDepartamento,
        state.dashboardStatus
      ].filter(Boolean);

      definirTexto(
        'dashboardFilterSummary',
        filtrosAtivos.length
          ? pluralizarQuantidade(colaboradores.length, 'processo no recorte selecionado', 'processos no recorte selecionado')
          : 'Exibindo todos os processos'
      );

      definirTexto(
        'dashboardResultCount',
        colaboradores.length === 1
          ? '1 processo encontrado no recorte atual.'
          : colaboradores.length + ' processos encontrados no recorte atual.'
      );

      renderizarDistribuicaoStatus(indicadores);

      renderizarLinhas(
        colaboradores.slice(0, 5),
        'recentCollaboratorsBody',
        filtrosAtivos.length
          ? 'Nenhum onboarding corresponde aos filtros selecionados.'
          : 'Nenhum onboarding foi cadastrado.'
      );
    }

    function pluralizarQuantidade(quantidade, singular, plural) {
      const numero = Number(quantidade || 0);
      return numero + ' ' + (numero === 1 ? singular : plural);
    }

    function definirIconeFontAwesome(elemento, classeIcone) {
      if (!elemento) return;
      elemento.innerHTML = '<i class="fa-solid ' + classeIcone + '" aria-hidden="true"></i>';
    }

    function definirConteudoBotao(button, classeIcone, texto) {
      if (!button) return;
      button.innerHTML =
        '<i class="fa-solid ' + classeIcone + '" aria-hidden="true"></i>' +
        '<span>' + escaparHtml(texto) + '</span>';
    }

    function atualizarEstadoCardsDashboard() {
      document.querySelectorAll('[data-dashboard-status]').forEach(function (card) {
        const ativo = (card.dataset.dashboardStatus || '') === state.dashboardStatus;
        card.classList.toggle('is-active', ativo);
        card.setAttribute('aria-pressed', String(ativo));
      });
    }

    function atualizarInsightDashboard(indicadores) {
      const insight = document.getElementById('dashboardInsight');
      const icon = document.getElementById('dashboardInsightIcon');
      const title = document.getElementById('dashboardInsightTitle');
      const text = document.getElementById('dashboardInsightText');
      const action = document.getElementById('dashboardInsightAction');

      insight.className = 'dashboard-insight';
      action.hidden = true;
      action.dataset.dashboardStatus = '';
      action.dataset.goView = '';

      if (!indicadores.total) {
        const possuiFiltro = Boolean(state.dashboardDepartamento || state.dashboardStatus);
        insight.classList.add('is-neutral');
        definirIconeFontAwesome(icon, 'fa-magnifying-glass');
        title.textContent = possuiFiltro
          ? 'Nenhum processo neste recorte'
          : 'Nenhum onboarding cadastrado';
        text.textContent = possuiFiltro
          ? 'Altere ou limpe os filtros para visualizar outros processos.'
          : 'Cadastre o primeiro colaborador para iniciar o acompanhamento operacional.';
        action.hidden = false;
        definirConteudoBotao(
          action,
          possuiFiltro ? 'fa-filter-circle-xmark' : 'fa-user-plus',
          possuiFiltro ? 'Limpar filtros' : 'Novo onboarding'
        );
        if (possuiFiltro) action.dataset.dashboardStatus = '__clear__';
        else action.dataset.goView = 'new';
        return;
      }

      if (indicadores.tarefasAtrasadas > 0) {
        insight.classList.add('is-danger');
        definirIconeFontAwesome(icon, 'fa-triangle-exclamation');
        title.textContent = pluralizarQuantidade(indicadores.tarefasAtrasadas, 'tarefa com prazo vencido', 'tarefas com prazo vencido');
        text.textContent = 'Revise os processos ativos para evitar impacto no cronograma de integração.';
        action.hidden = false;
        definirConteudoBotao(action, 'fa-users', 'Abrir colaboradores');
        action.dataset.goView = 'collaborators';
        return;
      }

      if (indicadores.pendentes > 0) {
        insight.classList.add('is-warning');
        definirIconeFontAwesome(icon, 'fa-arrow-right');
        title.textContent = pluralizarQuantidade(indicadores.pendentes, 'processo aguarda início', 'processos aguardam início');
        text.textContent = 'Inicie a primeira tarefa para movimentar o processo e atualizar o progresso operacional.';
        action.hidden = false;
        definirConteudoBotao(action, 'fa-clock', 'Ver pendentes');
        action.dataset.dashboardStatus = 'Pendente';
        return;
      }

      if (indicadores.emAndamento > 0) {
        insight.classList.add('is-info');
        definirIconeFontAwesome(icon, 'fa-circle-play');
        title.textContent = pluralizarQuantidade(indicadores.emAndamento, 'processo em andamento', 'processos em andamento');
        text.textContent = 'A operação está ativa. Acompanhe tarefas, prazos e histórico de cada colaborador.';
        action.hidden = false;
        definirConteudoBotao(action, 'fa-circle-play', 'Ver em andamento');
        action.dataset.dashboardStatus = 'Em andamento';
        return;
      }

      if (indicadores.concluidos === indicadores.total) {
        insight.classList.add('is-success');
        definirIconeFontAwesome(icon, 'fa-circle-check');
        title.textContent = 'Todos os processos do recorte foram concluídos';
        text.textContent = 'As etapas obrigatórias foram finalizadas e o progresso está consolidado.';
        return;
      }

      insight.classList.add('is-neutral');
      definirIconeFontAwesome(icon, 'fa-circle-info');
      title.textContent = 'Recorte operacional atualizado';
      text.textContent = 'Os indicadores refletem os filtros selecionados e os dados atuais do Airtable.';
    }

    function formatarNumeroCompacto(valor) {
      const numero = Number(valor || 0);
      return Number.isInteger(numero)
        ? String(numero)
        : numero.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }

    function renderizarTabelaCompleta() {
      const filtrados = obterColaboradoresFiltrados();

      definirTexto(
        'collaboratorCount',
        filtrados.length === 1
          ? '1 colaborador encontrado'
          : filtrados.length + ' colaboradores encontrados'
      );

      renderizarLinhas(
        filtrados,
        'allCollaboratorsBody',
        possuiFiltrosColaboradores()
          ? 'Nenhum colaborador corresponde aos filtros.'
          : 'Nenhum onboarding foi cadastrado.'
      );
    }
    function atualizarOpcoesFiltros() {
      const departamentos = Array.from(
        new Set(
          state.colaboradores
            .map(function (item) { return item.departamento; })
            .filter(Boolean)
        )
      ).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });

      const status = ['Pendente', 'Em andamento', 'Concluído', 'Cancelado'];

      popularSelect('dashboardDepartmentFilter', departamentos, 'Todos os departamentos', state.dashboardDepartamento);
      popularSelect('collaboratorDepartmentFilter', departamentos, 'Todos', state.filtroDepartamento);
      popularSelect('dashboardStatusFilter', status, 'Todos os status', state.dashboardStatus);
      popularSelect('collaboratorStatusFilter', status, 'Todos', state.filtroStatus);
    }

    function popularSelect(id, opcoes, rotuloPadrao, valorAtual) {
      const select = document.getElementById(id);
      if (!select) return;

      select.innerHTML =
        '<option value="">' + escaparHtml(rotuloPadrao) + '</option>' +
        opcoes.map(function (opcao) {
          return '<option value="' + escaparAtributo(opcao) + '">' +
            escaparHtml(opcao) +
            '</option>';
        }).join('');

      select.value = valorAtual || '';
    }

    function obterColaboradoresDashboardFiltrados() {
      return state.colaboradores.filter(function (colaborador) {
        return (
          (!state.dashboardDepartamento || colaborador.departamento === state.dashboardDepartamento) &&
          (!state.dashboardStatus || colaborador.status === state.dashboardStatus)
        );
      });
    }

    function possuiFiltrosColaboradores() {
      return Boolean(
        state.pesquisa ||
        state.filtroDepartamento ||
        state.filtroStatus
      );
    }

    function obterColaboradoresFiltrados() {
      const filtrados = state.colaboradores.filter(function (colaborador) {
        const correspondePesquisa = !state.pesquisa || [
          colaborador.nome,
          colaborador.cargo,
          colaborador.departamento,
          colaborador.status
        ].join(' ').toLocaleLowerCase('pt-BR').includes(state.pesquisa);

        return (
          correspondePesquisa &&
          (!state.filtroDepartamento || colaborador.departamento === state.filtroDepartamento) &&
          (!state.filtroStatus || colaborador.status === state.filtroStatus)
        );
      });

      return filtrados.sort(function (a, b) {
        switch (state.ordenacao) {
          case 'name':
            return String(a.nome).localeCompare(String(b.nome), 'pt-BR');
          case 'admission':
            return String(a.dataAdmissao || '9999').localeCompare(String(b.dataAdmissao || '9999'));
          case 'progress-desc':
            return Number(b.progresso || 0) - Number(a.progresso || 0);
          case 'progress-asc':
            return Number(a.progresso || 0) - Number(b.progresso || 0);
          default:
            return new Date(b.criadoEm || 0).getTime() - new Date(a.criadoEm || 0).getTime();
        }
      });
    }

    function calcularIndicadoresCliente(colaboradores) {
      const resumo = {
        total: colaboradores.length,
        pendentes: 0,
        emAndamento: 0,
        concluidos: 0,
        cancelados: 0,
        tarefasGeradas: 0,
        eventosCriados: 0,
        emailsEnviados: 0,
        tarefasAtrasadas: 0,
        progressoMedio: 0
      };

      let somaProgresso = 0;

      colaboradores.forEach(function (colaborador) {
        if (colaborador.status === 'Pendente') resumo.pendentes++;
        else if (colaborador.status === 'Em andamento') resumo.emAndamento++;
        else if (colaborador.status === 'Concluído') resumo.concluidos++;
        else if (colaborador.status === 'Cancelado') resumo.cancelados++;

        resumo.tarefasGeradas += Number(colaborador.quantidadeTarefas || 0);
        resumo.tarefasAtrasadas += Number(colaborador.tarefasAtrasadas || 0);
        if (colaborador.eventoCriado) resumo.eventosCriados++;
        if (colaborador.emailEnviado) resumo.emailsEnviados++;
        somaProgresso += Number(colaborador.progresso || 0);
      });

      resumo.progressoMedio = resumo.total
        ? Math.round(somaProgresso / resumo.total)
        : 0;

      return resumo;
    }

    function renderizarDistribuicaoStatus(indicadores) {
      const total = Number(indicadores.total || 0);
      const itens = [
        { chave: 'pendentes', rotulo: 'Pendentes', classe: 'is-pending' },
        { chave: 'emAndamento', rotulo: 'Em andamento', classe: 'is-progress' },
        { chave: 'concluidos', rotulo: 'Concluídos', classe: 'is-completed' },
        { chave: 'cancelados', rotulo: 'Cancelados', classe: 'is-cancelled' }
      ];

      definirTexto(
        'statusDistributionTotal',
        total === 1 ? '1 processo' : total + ' processos'
      );

      document.getElementById('statusDistributionBar').innerHTML = itens.map(function (item) {
        const quantidade = Number(indicadores[item.chave] || 0);
        const percentual = total ? (quantidade / total) * 100 : 0;
        return '<span class="status-segment ' + item.classe + '" style="width:' + percentual + '%" title="' +
          escaparAtributo(item.rotulo + ': ' + quantidade) + '"></span>';
      }).join('');

      document.getElementById('statusDistributionLegend').innerHTML = itens.map(function (item) {
        const quantidade = Number(indicadores[item.chave] || 0);
        const percentual = total ? Math.round((quantidade / total) * 100) : 0;
        return '<span class="distribution-legend-item"><i class="' + item.classe + '"></i>' +
          '<span>' + escaparHtml(item.rotulo) + '</span><strong>' + quantidade + '</strong>' +
          '<small>' + percentual + '%</small></span>';
      }).join('');
    }

    function limparFiltrosDashboard() {
      state.dashboardDepartamento = '';
      state.dashboardStatus = '';
      document.getElementById('dashboardDepartmentFilter').value = '';
      document.getElementById('dashboardStatusFilter').value = '';
      renderizarDashboard();
    }

    function limparFiltrosColaboradores() {
      state.pesquisa = '';
      state.filtroDepartamento = '';
      state.filtroStatus = '';
      state.ordenacao = 'recent';

      document.getElementById('collaboratorSearch').value = '';
      document.getElementById('collaboratorDepartmentFilter').value = '';
      document.getElementById('collaboratorStatusFilter').value = '';
      document.getElementById('collaboratorSort').value = 'recent';
      renderizarTabelaCompleta();
    }

    function exportarColaboradoresCsv() {
      const colaboradores = obterColaboradoresFiltrados();

      if (!colaboradores.length) {
        mostrarToast('Não há registros para exportar.', 'error');
        return;
      }

      const linhas = [[
        'Nome', 'Cargo', 'Departamento', 'Admissão', 'Status', 'Progresso',
        'Tarefas', 'Tarefas atrasadas', 'Agenda', 'E-mail'
      ]];

      colaboradores.forEach(function (item) {
        linhas.push([
          item.nome,
          item.cargo,
          item.departamento,
          formatarData(item.dataAdmissao),
          item.status,
          item.progresso + '%',
          item.quantidadeTarefas,
          item.tarefasAtrasadas || 0,
          item.eventoCriado ? 'Criado' : 'Pendente',
          item.emailEnviado ? 'Enviado' : 'Pendente'
        ]);
      });

      const csv = '﻿' + linhas.map(function (linha) {
        return linha.map(function (valor) {
          return '"' + String(valor == null ? '' : valor).replace(/"/g, '""') + '"';
        }).join(';');
      }).join('\r\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'onboardflow-colaboradores-' + formatarDataInput(new Date()) + '.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      mostrarToast('Arquivo CSV gerado com sucesso.', 'success');
    }

    function renderizarLinhas(colaboradores, bodyId, mensagemVazia) {
      const tbody = document.getElementById(bodyId);

      if (!colaboradores.length) {
        tbody.innerHTML =
          '<tr><td colspan="9" class="empty-cell">' +
            '<div class="table-empty-state">' +
              '<span aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>' +
              '<strong>Nenhum resultado encontrado</strong>' +
              '<p>' + escaparHtml(mensagemVazia) + '</p>' +
            '</div>' +
          '</td></tr>';
        return;
      }

      tbody.innerHTML = colaboradores.map(criarLinhaColaborador).join('');
    }

    function normalizarTextoCentralCliente(valor) {
      return String(valor || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function carregarCentralTarefas(forcarAtualizacao, aoConcluir) {
      if (state.centralTarefasCarregando) return;

      if (state.centralTarefasCarregada && !forcarAtualizacao) {
        renderizarCentralTarefas();
        return;
      }

      state.centralTarefasCarregando = true;

      definirCarregamento(
        true,
        'Carregando central de tarefas',
        'Consultando tarefas, etapas e colaboradores.'
      );

      google.script.run
        .withSuccessHandler(function (resultado) {
          state.centralTarefasCarregando = false;
          definirCarregamento(false);

          if (!resultado || !resultado.sucesso) {
            exibirErroCentralTarefas(
              resultado && resultado.mensagem
                ? resultado.mensagem
                : 'Não foi possível carregar as tarefas.'
            );
            return;
          }

          state.centralTarefasDados = resultado;
          state.centralTarefasCarregada = true;
          popularFiltrosCentralTarefas();
          renderizarCentralTarefas();

          if (typeof aoConcluir === 'function') {
            aoConcluir(resultado);
          }

          mostrarToast('Central de Tarefas atualizada.', 'success');
        })
        .withFailureHandler(function (error) {
          state.centralTarefasCarregando = false;
          definirCarregamento(false);
          exibirErroCentralTarefas(extrairMensagemErro(error));
        })
        .obterCentralTarefasV052();
    }

    function exibirErroCentralTarefas(mensagem) {
      state.centralTarefasCarregada = false;

      document.getElementById('taskFlowContainer').innerHTML =
        '<div class="task-center-empty-state is-error">' +
          '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>' +
          '<strong>Não foi possível carregar as tarefas</strong>' +
          '<p>' + escaparHtml(mensagem || 'Atualize a página ou tente novamente em alguns instantes.') + '</p>' +
          '<button type="button" class="button button-primary" data-retry-task-center>' +
            '<i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i><span>Tentar novamente</span>' +
          '</button>' +
        '</div>';

      document.getElementById('taskCenterGroups').innerHTML =
        '<div class="task-center-empty-state is-error">' +
          '<i class="fa-solid fa-cloud-arrow-down" aria-hidden="true"></i>' +
          '<strong>Dados indisponíveis</strong>' +
          '<p>A Central de Tarefas não pôde ser atualizada.</p>' +
        '</div>';

      const retry = document.querySelector('[data-retry-task-center]');
      if (retry) retry.addEventListener('click', function () { carregarCentralTarefas(true); });

      tratarErro(mensagem || 'Não foi possível carregar a Central de Tarefas.');
    }
