<style>
  :root {
    --primary: #075985;
    --primary-dark: #0c4a6e;
    --primary-light: #e0f2fe;
    --accent: #0f766e;
    --accent-light: #ccfbf1;
    --background: #f4f7fa;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --text: #172033;
    --text-muted: #64748b;
    --border: #dbe4ee;
    --success: #15803d;
    --success-soft: #dcfce7;
    --warning: #b45309;
    --warning-soft: #fef3c7;
    --danger: #b91c1c;
    --danger-soft: #fee2e2;
    --shadow: 0 14px 38px rgba(15, 23, 42, 0.08);
    --radius-large: 20px;
    --radius-medium: 14px;
    --radius-small: 9px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-width: 320px;
    background: var(--background);
  }

  body {
    min-height: 100vh;
    margin: 0;
    color: var(--text);
    font-family: Inter, Arial, Helvetica, sans-serif;
    background: var(--background);
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    border: 0;
  }

  button,
  select {
    cursor: pointer;
  }

  .fa-solid,
  .fa-regular,
  .fa-brands {
    line-height: 1;
  }

  button > i,
  .button > i,
  .text-button > i,
  .nav-button > i,
  .details-tab-button > i {
    flex: 0 0 auto;
  }

  .button,
  .text-button,
  .nav-button,
  .details-tab-button,
  .task-action-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [role="button"]:focus-visible {
    outline: 3px solid rgba(14, 165, 233, 0.28);
    outline-offset: 2px;
  }

  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    min-height: 76px;
    display: grid;
    grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr);
    align-items: center;
    gap: 24px;
    padding: 12px 32px;
    background: rgba(255, 255, 255, 0.96);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(16px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 13px;
    box-shadow: 0 8px 18px rgba(7, 89, 133, 0.22);
  }

  .brand-name,
  .brand-description {
    display: block;
  }

  .brand-name {
    font-size: 17px;
  }

  .brand-description {
    margin-top: 2px;
    color: var(--text-muted);
    font-size: 12px;
  }

  .main-navigation {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 13px;
  }

  .nav-button {
    min-height: 38px;
    padding: 9px 14px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 700;
    background: transparent;
    border-radius: 9px;
    transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .nav-button:hover {
    color: var(--primary);
  }

  .nav-button.is-active {
    color: var(--primary-dark);
    background: var(--surface);
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
  }

  .topbar-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
  }

  .connection-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #94a3b8;
    border-radius: 999px;
  }

  .connection-status.is-connected .status-dot {
    background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
  }

  .connection-status.is-error .status-dot {
    background: #ef4444;
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
  }

  .connection-status.is-loading .status-dot {
    animation: pulse 1.2s ease-in-out infinite;
  }

  .main-content {
    width: min(1480px, 100%);
    flex: 1;
    margin: 0 auto;
    padding: 28px 32px 48px;
  }

  .environment-banner {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 24px;
    padding: 14px 17px;
    color: #075985;
    background: #e0f2fe;
    border: 1px solid #bae6fd;
    border-radius: var(--radius-medium);
  }

  .environment-banner p {
    margin: 4px 0 0;
    color: #0369a1;
    font-size: 13px;
  }

  .environment-icon {
    width: 23px;
    height: 23px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 800;
    border: 2px solid currentColor;
    border-radius: 999px;
  }

  .view-section {
    display: none;
    animation: fadeIn 0.22s ease;
  }

  .view-section.is-active {
    display: block;
  }

  .page-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 24px;
  }

  .page-heading h1 {
    margin: 5px 0 7px;
    font-size: clamp(27px, 4vw, 38px);
    line-height: 1.1;
    letter-spacing: -1.1px;
  }

  .page-heading p,
  .panel-header p,
  .form-card-header p {
    margin: 0;
    color: var(--text-muted);
    line-height: 1.55;
  }

  .eyebrow {
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .button {
    min-height: 42px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 10px 17px;
    font-weight: 750;
    font-size: 13px;
    border-radius: 10px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  .button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .button-primary {
    color: #ffffff;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 7px 17px rgba(7, 89, 133, 0.2);
  }

  .button-primary:hover:not(:disabled) {
    box-shadow: 0 10px 23px rgba(7, 89, 133, 0.26);
  }

  .button-secondary {
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .button-secondary:hover:not(:disabled) {
    background: var(--surface-soft);
  }

  .button-compact {
    min-height: 36px;
    padding: 7px 12px;
  }

  .button-large {
    min-height: 48px;
    padding: 12px 22px;
  }

  .button-full {
    width: 100%;
  }

  .text-button {
    padding: 6px;
    color: var(--primary);
    font-weight: 750;
    font-size: 13px;
    background: transparent;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .metric-card,
  .panel,
  .form-card,
  .automation-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-large);
    box-shadow: var(--shadow);
  }

  .metric-card {
    min-height: 150px;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  .metric-label {
    min-height: 35px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 750;
    line-height: 1.4;
  }

  .metric-value {
    margin: 12px 0 4px;
    color: var(--primary-dark);
    font-size: 34px;
    line-height: 1;
    letter-spacing: -1px;
  }

  .metric-detail {
    margin-top: auto;
    color: var(--text-muted);
    font-size: 11px;
  }

  .panel {
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 21px 23px;
    border-bottom: 1px solid var(--border);
  }

  .panel-header h2,
  .form-card-header h2,
  .automation-preview h2 {
    margin: 0 0 5px;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .panel-header p,
  .form-card-header p {
    font-size: 13px;
  }

  .table-container {
    width: 100%;
    overflow-x: auto;
  }

  .data-table {
    width: 100%;
    min-width: 970px;
    border-collapse: collapse;
  }

  .data-table th,
  .data-table td {
    padding: 14px 17px;
    text-align: left;
    vertical-align: middle;
    border-bottom: 1px solid #edf2f7;
  }

  .data-table th {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    background: var(--surface-soft);
  }

  .data-table td {
    font-size: 12px;
  }

  .data-table tbody tr:hover {
    background: #fbfdff;
  }

  .data-table tbody tr:last-child td {
    border-bottom: 0;
  }

  .person-cell strong,
  .person-cell span {
    display: block;
  }

  .person-cell strong {
    max-width: 230px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .person-cell span {
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 11px;
  }

  .status-badge,
  .integration-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 9px;
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
    border-radius: 999px;
  }

  .status-pendente {
    color: var(--warning);
    background: var(--warning-soft);
  }

  .status-em-andamento {
    color: #0369a1;
    background: #e0f2fe;
  }

  .status-concluido,
  .status-concluida {
    color: var(--success);
    background: var(--success-soft);
  }

  .status-cancelado {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .status-onboarding-cancelado {
    color: #475569;
    background: #e2e8f0;
  }

  .integration-success {
    color: var(--success);
    background: var(--success-soft);
  }

  .integration-pending {
    color: var(--text-muted);
    background: #e2e8f0;
  }

  .progress-container {
    width: 90px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 10px;
  }

  .progress-track {
    height: 6px;
    overflow: hidden;
    background: #e2e8f0;
    border-radius: 999px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: inherit;
  }

  .empty-cell {
    padding: 44px !important;
    color: var(--text-muted);
    text-align: center !important;
  }

  .onboarding-form {
    display: grid;
    gap: 20px;
  }

  .form-card {
    padding: 24px;
  }

  .form-card-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .form-step {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    color: #ffffff;
    font-weight: 800;
    background: var(--primary);
    border-radius: 10px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    margin-top: 22px;
  }

  .form-field {
    min-width: 0;
  }

  .form-field-wide {
    grid-column: 1 / -1;
  }

  .form-field label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 750;
  }

  .form-field label span {
    color: var(--danger);
  }

  .form-field input,
  .form-field select,
  .form-field textarea,
  .search-field input {
    width: 100%;
    color: var(--text);
    background: var(--surface);
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    transition: border 0.18s ease, box-shadow 0.18s ease;
  }

  .form-field input,
  .form-field select {
    min-height: 44px;
    padding: 9px 12px;
  }

  .form-field textarea {
    min-height: 105px;
    padding: 12px;
    resize: vertical;
  }

  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus,
  .search-field input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(7, 89, 133, 0.11);
  }

  .form-field small {
    display: block;
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 10px;
    line-height: 1.4;
  }

  .automation-preview {
    padding: 24px;
  }

  .automation-steps {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 13px;
    margin-top: 20px;
  }

  .automation-step {
    position: relative;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    padding: 17px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-medium);
  }

  .automation-step>span {
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    margin-bottom: 15px;
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    background: var(--primary-light);
    border-radius: 8px;
  }

  .automation-step strong {
    font-size: 13px;
  }

  .automation-step small {
    margin-top: 4px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  .panel-header-filter {
    align-items: flex-end;
  }

  .search-field {
    width: min(390px, 100%);
  }

  .search-field input {
    min-height: 42px;
    padding: 10px 13px;
  }

  .app-footer {
    min-height: 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 16px 32px;
    color: var(--text-muted);
    font-size: 11px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  .loading-overlay,
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.58);
    backdrop-filter: blur(5px);
  }

  .loading-overlay[hidden],
  .modal-backdrop[hidden],
  .toast[hidden] {
    display: none;
  }

  /*
   * Hierarquia visual dos overlays:
   * detalhes < confirmação/resultado < carregamento < notificações.
   * Evita que a confirmação de cancelamento abra atrás do modal principal.
   */
  #resultModal,
  #confirmationModal {
    z-index: 400;
  }

  .loading-overlay {
    z-index: 500;
  }

  body.confirmation-modal-open #onboardingDetailsModal {
    pointer-events: none;
  }

  .loading-card,
  .modal-card {
    width: min(440px, 100%);
    padding: 30px;
    text-align: center;
    background: var(--surface);
    border-radius: var(--radius-large);
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.26);
  }

  .loading-card p,
  .modal-card p {
    margin: 8px 0 0;
    color: var(--text-muted);
    line-height: 1.55;
  }

  .spinner {
    width: 42px;
    height: 42px;
    margin: 0 auto 17px;
    border: 4px solid #dbeafe;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .modal-card {
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 34px;
    height: 34px;
    color: var(--text-muted);
    font-size: 24px;
    background: transparent;
    border-radius: 9px;
  }

  .modal-close:hover {
    background: var(--surface-soft);
  }

  .success-icon {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    margin: 0 auto 17px;
    color: var(--success);
    font-size: 28px;
    font-weight: 900;
    background: var(--success-soft);
    border-radius: 999px;
  }

  .modal-card h2 {
    margin: 0;
  }

  .result-details {
    display: grid;
    gap: 8px;
    margin: 22px 0;
    text-align: left;
  }

  .result-detail {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 12px;
    font-size: 12px;
    background: var(--surface-soft);
    border-radius: 9px;
  }

  .result-detail span {
    color: var(--text-muted);
  }

  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 600;
    width: min(390px, calc(100% - 44px));
    padding: 15px 17px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
    background: #1e293b;
    border-radius: 12px;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.25);
    animation: toastIn 0.22s ease;
  }

  .toast.is-error {
    background: var(--danger);
  }

  .toast.is-success {
    background: var(--success);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes pulse {
    50% {
      opacity: 0.35;
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(3px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes toastIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }


  @media (max-width: 1180px) {
    .topbar {
      grid-template-columns: 1fr auto;
    }

    .main-navigation {
      grid-column: 1 / -1;
      grid-row: 2;
      justify-self: center;
      order: 3;
    }

    .metrics-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }

  @media (max-width: 760px) {
    .topbar {
      position: static;
      display: flex;
      flex-wrap: wrap;
      padding: 13px 18px;
    }

    .brand {
      flex: 1;
    }

    .brand-description,
    .connection-status {
      display: none;
    }

    .main-navigation {
      width: 100%;
      order: 3;
      overflow-x: auto;
    }

    .nav-button {
      flex: 1 0 auto;
    }

    .main-content {
      padding: 22px 16px 38px;
    }

    .page-heading {
      align-items: flex-start;
      flex-direction: column;
    }

    .page-heading .button {
      width: 100%;
    }

    .metrics-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric-card {
      min-height: 135px;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .form-field-wide {
      grid-column: auto;
    }

    .automation-steps {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .panel-header,
    .panel-header-filter {
      align-items: flex-start;
      flex-direction: column;
    }

    .search-field {
      width: 100%;
    }

    .form-actions {
      flex-direction: column-reverse;
    }

    .form-actions .button {
      width: 100%;
    }

    .app-footer {
      align-items: flex-start;
      flex-direction: column;
      padding: 16px;
    }
  }

  @media (max-width: 450px) {
    .metrics-grid {
      grid-template-columns: 1fr;
    }

    .automation-steps {
      grid-template-columns: 1fr;
    }

    .form-card,
    .automation-preview {
      padding: 19px;
    }
  }

  /* ================================================================
     GESTÃO DO ONBOARDING - v0.5.2
     ================================================================ */

  .clickable-row {
    cursor: pointer;
    transition:
      background 0.18s ease,
      box-shadow 0.18s ease;
  }

  .clickable-row:hover,
  .clickable-row:focus-visible {
    background: #f0f9ff !important;
    box-shadow:
      inset 4px 0 0 var(--primary);
    outline: none;
  }

  .details-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 150;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(15, 23, 42, 0.62);
    backdrop-filter: blur(7px);
  }

  .details-modal-backdrop[hidden] {
    display: none;
  }

  .details-modal-card {
    width: min(1180px, 100%);
    max-height: min(880px, calc(100vh - 48px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
    border-radius: 24px;
    box-shadow:
      0 32px 90px rgba(15, 23, 42, 0.34);
  }

  .details-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    padding: 24px 26px 20px;
    border-bottom: 1px solid var(--border);
    background:
      linear-gradient(
        135deg,
        #ffffff 0%,
        #f0f9ff 100%
      );
  }

  .details-modal-heading h2 {
    margin: 10px 0 5px;
    font-size: clamp(22px, 3vw, 30px);
  }

  .details-modal-heading p {
    margin: 0;
    color: var(--text-muted);
  }

  .details-modal-close {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    font-size: 28px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .details-modal-close:hover {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .details-modal-loading {
    min-height: 360px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 8px;
    padding: 40px;
    text-align: center;
  }

  .details-modal-loading[hidden] {
    display: none !important;
  }

  .details-modal-loading p {
    margin: 0;
    color: var(--text-muted);
  }

  #detailsModalContent {
    min-height: 0;
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }

  #detailsModalContent[hidden] {
    display: none;
  }

  .details-tabs {
    display: flex;
    gap: 7px;
    padding: 12px 24px;
    overflow-x: auto;
    background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
  }

  .details-tab-button {
    min-height: 38px;
    padding: 8px 15px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 800;
    background: transparent;
    border-radius: 10px;
  }

  .details-tab-button.is-active {
    color: #ffffff;
    background: var(--primary);
  }

  .details-tab-panel {
    display: none;
    min-height: 0;
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }

  .details-tab-panel.is-active {
    display: block;
  }

  .details-summary-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .details-summary-card {
    min-height: 108px;
    padding: 17px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 15px;
  }

  .details-summary-card span,
  .details-info-item span {
    display: block;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .details-summary-card strong {
    display: block;
    margin-top: 10px;
    color: var(--primary-dark);
    font-size: 25px;
  }

  .details-summary-card small {
    display: block;
    margin-top: 4px;
    color: var(--text-muted);
  }

  .details-progress-panel {
    margin-top: 18px;
    padding: 20px;
    background:
      linear-gradient(
        135deg,
        #eff6ff,
        #f0fdfa
      );
    border: 1px solid #bae6fd;
    border-radius: 17px;
  }

  .details-progress-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 12px;
  }

  .details-progress-heading h3,
  .details-section-heading h3 {
    margin: 0 0 3px;
  }

  .details-progress-heading p,
  .details-section-heading p {
    margin: 0;
    color: var(--text-muted);
    font-size: 12px;
  }

  .details-progress-value {
    color: var(--primary-dark);
    font-size: 28px;
    font-weight: 900;
  }

  .details-progress-track {
    height: 12px;
    overflow: hidden;
    background: rgba(148, 163, 184, 0.25);
    border-radius: 999px;
  }

  .details-progress-bar {
    height: 100%;
    background:
      linear-gradient(
        90deg,
        var(--primary),
        var(--accent)
      );
    border-radius: inherit;
  }

  .details-warning {
    margin-top: 14px;
    padding: 12px 14px;
    color: #92400e;
    font-size: 12px;
    line-height: 1.5;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 11px;
  }

  .details-info-grid {
    display: grid;
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
    gap: 13px;
    margin-top: 18px;
  }

  .details-info-item {
    min-height: 78px;
    padding: 14px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 13px;
  }

  .details-info-item strong {
    display: block;
    margin-top: 8px;
    overflow-wrap: anywhere;
    font-size: 12px;
  }

  .details-section-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 18px;
    margin-bottom: 16px;
  }

  .details-task-list {
    display: grid;
    gap: 11px;
  }

  .details-task-item {
    display: grid;
    grid-template-columns:
      minmax(250px, 2fr)
      minmax(145px, 1fr)
      minmax(110px, 0.75fr)
      minmax(120px, 0.85fr)
      minmax(92px, 0.55fr);
    align-items: center;
    gap: 16px;
    padding: 15px 17px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .details-task-item.is-overdue {
    border-color: #fecaca;
    background: #fffafa;
  }

  .details-task-title strong,
  .details-task-title span,
  .details-task-meta strong,
  .details-task-meta span {
    display: block;
  }

  .details-task-title span,
  .details-task-meta span {
    margin-top: 4px;
    color: var(--text-muted);
    font-size: 11px;
  }

  .details-task-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .details-mini-badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 8px;
    font-size: 9px;
    font-weight: 800;
    border-radius: 999px;
  }

  .details-mini-badge.is-required {
    color: #7c2d12;
    background: #ffedd5;
  }

  .details-mini-badge.is-optional {
    color: #475569;
    background: #e2e8f0;
  }

  .details-mini-badge.is-overdue {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .details-warning-action {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .details-warning-action .button {
    flex: 0 0 auto;
  }

  .details-management-note {
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
  }

  .details-task-action {
    display: flex;
    justify-content: flex-end;
  }

  .task-action-button {
    min-width: 88px;
    min-height: 36px;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 800;
    border-radius: 10px;
    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease,
      opacity 0.16s ease;
  }

  .task-action-button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  .task-action-button:disabled {
    cursor: wait;
    opacity: 0.62;
  }

  .task-action-button.is-start {
    color: #075985;
    background: #e0f2fe;
    border: 1px solid #bae6fd;
  }

  .task-action-button.is-complete {
    color: #166534;
    background: #dcfce7;
    border: 1px solid #bbf7d0;
  }

  .task-action-button.is-reopen {
    color: #7c2d12;
    background: #ffedd5;
    border: 1px solid #fed7aa;
  }

  .task-action-button.is-loading {
    color: var(--text-muted);
    background: #e2e8f0;
    border-color: #cbd5e1;
  }

  .details-task-no-action {
    color: var(--text-muted);
    font-size: 10px;
  }

  .details-history-list {
    display: grid;
    gap: 14px;
  }

  .details-history-item {
    display: grid;
    grid-template-columns: 18px 1fr;
    gap: 14px;
  }

  .details-history-dot {
    width: 18px;
    height: 18px;
    margin-top: 4px;
    background: var(--primary);
    border: 4px solid #dbeafe;
    border-radius: 999px;
  }

  .details-history-content {
    padding: 14px 16px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 13px;
  }

  .details-history-content strong {
    display: block;
  }

  .details-history-content p {
    margin: 6px 0 0;
    color: var(--text-muted);
    font-size: 12px;
  }

  .details-history-content time {
    display: block;
    margin-top: 8px;
    color: var(--text-muted);
    font-size: 10px;
  }

  .details-empty-state {
    padding: 52px 24px;
    color: var(--text-muted);
    text-align: center;
    background: var(--surface-soft);
    border: 1px dashed #cbd5e1;
    border-radius: 15px;
  }

  .details-modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    padding: 14px 24px;
    color: var(--text-muted);
    font-size: 10px;
    background: var(--surface-soft);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    .details-summary-grid {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }

    .details-info-grid {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }

    .details-task-item {
      grid-template-columns:
        minmax(220px, 1.7fr)
        minmax(130px, 1fr);
    }

    .details-task-action {
      justify-content: flex-start;
    }

    .details-warning-action {
      align-items: flex-start;
      flex-direction: column;
    }
  }

  @media (max-width: 620px) {
    .details-modal-backdrop {
      padding: 0;
    }

    .details-modal-card {
      width: 100%;
      max-height: 100vh;
      min-height: 100vh;
      border-radius: 0;
    }

    .details-summary-grid,
    .details-info-grid,
    .details-task-item {
      grid-template-columns: 1fr;
    }

    .details-progress-heading,
    .details-modal-footer {
      align-items: flex-start;
      flex-direction: column;
    }
  }


  /* ================================================================
     CENTRAL OPERACIONAL - v0.5.2
     Filtros, indicadores, cancelamento e refinamento responsivo
     ================================================================ */

  :root {
    --pending: #d97706;
    --pending-soft: #fff7d6;
    --progress: #0284c7;
    --progress-soft: #e0f2fe;
    --completed: #16a34a;
    --completed-soft: #dcfce7;
    --cancelled: #64748b;
    --cancelled-soft: #e2e8f0;
  }

  .button-danger {
    color: #ffffff;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    box-shadow: 0 7px 17px rgba(185, 28, 28, 0.18);
  }

  .button-danger:hover:not(:disabled) {
    box-shadow: 0 10px 23px rgba(185, 28, 28, 0.25);
  }

  .dashboard-toolbar,
  .collaborator-filter-bar,
  .task-filter-toolbar {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 16px;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--border);
    border-radius: var(--radius-medium);
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.05);
  }

  .dashboard-toolbar {
    margin-bottom: 16px;
  }

  .filter-group,
  .task-search-field,
  .filter-field-wide {
    min-width: 0;
  }

  .filter-group label,
  .task-search-field label,
  .collaborator-filter-bar label {
    display: block;
    margin-bottom: 6px;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .filter-group select,
  .task-search-field input,
  .collaborator-filter-bar input,
  .collaborator-filter-bar select {
    width: 100%;
    min-height: 40px;
    padding: 8px 11px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .filter-group select:focus,
  .task-search-field input:focus,
  .collaborator-filter-bar input:focus,
  .collaborator-filter-bar select:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
  }

  .dashboard-toolbar .filter-group {
    width: min(240px, 100%);
  }

  .filter-summary {
    margin-left: auto;
    align-self: center;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
  }

  .metrics-grid-status {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .metric-card {
    position: relative;
    overflow: hidden;
  }

  .metric-card::before {
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    content: '';
    background: var(--primary);
  }

  .metric-card-pending::before { background: var(--pending); }
  .metric-card-progress::before { background: var(--progress); }
  .metric-card-completed::before { background: var(--completed); }
  .metric-card-cancelled::before { background: var(--cancelled); }
  .metric-card-average::before { background: var(--accent); }

  .operational-overview {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .status-overview-card,
  .integration-overview-card {
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-large);
    box-shadow: var(--shadow);
  }

  .overview-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .overview-heading h2 {
    margin: 5px 0 0;
    font-size: 18px;
  }

  .overview-total {
    padding: 6px 10px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 800;
    background: var(--surface-soft);
    border-radius: 999px;
  }

  .status-distribution-bar {
    height: 14px;
    display: flex;
    margin: 22px 0 15px;
    overflow: hidden;
    background: #eef2f7;
    border-radius: 999px;
  }

  .status-segment {
    min-width: 0;
    transition: width 0.3s ease;
  }

  .status-segment.is-pending,
  .distribution-legend-item i.is-pending { background: var(--pending); }
  .status-segment.is-progress,
  .distribution-legend-item i.is-progress { background: var(--progress); }
  .status-segment.is-completed,
  .distribution-legend-item i.is-completed { background: var(--completed); }
  .status-segment.is-cancelled,
  .distribution-legend-item i.is-cancelled { background: var(--cancelled); }

  .status-distribution-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
  }

  .distribution-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--text-muted);
    font-size: 11px;
  }

  .distribution-legend-item i {
    width: 9px;
    height: 9px;
    border-radius: 999px;
  }

  .distribution-legend-item strong {
    color: var(--text);
  }

  .integration-stat-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 17px;
  }

  .integration-stat {
    padding: 13px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .integration-stat span,
  .integration-stat strong {
    display: block;
  }

  .integration-stat span {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 750;
  }

  .integration-stat strong {
    margin-top: 6px;
    color: var(--primary-dark);
    font-size: 22px;
  }

  .integration-stat-danger strong {
    color: var(--danger);
  }

  .person-name-line {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .person-name-line strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }


  .collaborators-panel-header {
    flex-wrap: wrap;
  }

  .panel-header-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .collaborator-filter-bar {
    display: grid;
    grid-template-columns: minmax(260px, 1.5fr) repeat(3, minmax(170px, 0.7fr));
    border: 0;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
  }

  .task-count-cell {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  .overdue-inline-badge {
    display: inline-flex;
    padding: 3px 6px;
    color: var(--danger);
    font-size: 8px;
    font-weight: 800;
    background: var(--danger-soft);
    border-radius: 999px;
  }

  .data-table tbody tr.clickable-row:hover td {
    background: #f0f9ff;
  }

  .details-modal-card {
    height: min(880px, calc(100dvh - 48px));
  }

  .details-modal-header,
  .details-tabs,
  .details-modal-footer {
    flex: 0 0 auto;
  }

  #detailsModalContent {
    min-height: 0;
    overflow: hidden;
  }

  .details-tabs {
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
  }

  .details-tab-panel {
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
  }

  .details-modal-card.is-cancelled .details-modal-header {
    background: linear-gradient(135deg, #f8fafc, #e2e8f0);
  }

  .details-action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-bottom: 17px;
    padding: 13px 15px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .process-id-group span,
  .process-id-group strong {
    display: block;
  }

  .process-id-group span {
    color: var(--text-muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .process-id-group strong {
    margin-top: 4px;
    font-size: 12px;
  }

  .details-action-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }

  .cancelled-process-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-bottom: 16px;
    padding: 16px;
    color: #334155;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-left: 4px solid var(--cancelled);
    border-radius: 13px;
  }

  .cancelled-process-banner p {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 12px;
  }

  .details-summary-grid {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .details-summary-card {
    min-height: 104px;
  }

  .details-notes {
    margin-top: 18px;
    padding: 16px;
    background: #fffdf5;
    border: 1px solid #fde68a;
    border-radius: 13px;
  }

  .details-notes span {
    display: block;
    color: #92400e;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .details-notes p {
    margin: 7px 0 0;
    color: #78350f;
    line-height: 1.55;
  }

  .task-filter-toolbar {
    display: grid;
    grid-template-columns: minmax(240px, 1.4fr) repeat(3, minmax(150px, 0.7fr));
    margin-bottom: 8px;
    padding: 12px;
    box-shadow: none;
  }

  .task-filter-result {
    margin: 0 0 12px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
  }

  .details-task-item {
    transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }

  .details-task-item:hover {
    border-color: #bae6fd;
    box-shadow: 0 7px 20px rgba(15, 23, 42, 0.05);
    transform: translateY(-1px);
  }

  .details-task-no-action {
    padding: 7px 9px;
    background: var(--surface-soft);
    border-radius: 8px;
  }

  .confirmation-modal-card {
    max-width: 500px;
  }

  .confirmation-icon {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    margin: 0 auto 16px;
    color: var(--primary);
    font-size: 26px;
    font-weight: 900;
    background: var(--primary-light);
    border-radius: 999px;
  }

  .confirmation-icon.is-danger {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .confirmation-icon.is-positive {
    color: var(--success);
    background: var(--success-soft);
  }

  .confirmation-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 22px;
  }


  /* ================================================================

  .task-metric-progress {
    border-top: 3px solid #0284c7;
  }

  .task-metric-completed {
    border-top: 3px solid var(--success);
  }

  .task-metric-overdue {

  }

  .task-flow-panel,
  .task-center-list-panel {

  .task-flow-container {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    padding: 24px;
    overflow-x: auto;
  }

  .task-flow-container::before {
    position: absolute;
    top: 65px;
    right: 9%;
    left: 9%;
    height: 2px;
    content: '';
    background: linear-gradient(90deg, #bae6fd, #99f6e4);

  .task-flow-step {
    position: relative;
    z-index: 1;
    min-width: 180px;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 17px;
    color: var(--text);
    text-align: left;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 17px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    transition:
      transform 0.18s ease,
      border-color 0.18s ease,
      box-shadow 0.18s ease;
  }

  .task-flow-step:hover {

    border-color: #7dd3fc;
    box-shadow: 0 15px 34px rgba(15, 23, 42, 0.1);
  }

  .task-flow-step.is-active {
    border-color: var(--primary);
    box-shadow:
      0 0 0 3px rgba(7, 89, 133, 0.11),
      0 15px 34px rgba(15, 23, 42, 0.1);
  }

  .task-flow-step.is-empty {
    opacity: 0.62;
  }


  .task-flow-step.is-filter-muted:not(.is-empty) {
    opacity: 0.78;
  }

  .task-flow-step.is-filter-muted:hover {
    opacity: 1;
  }

  .task-flow-number {
    position: absolute;

    right: 13px;

    font-weight: 900;
